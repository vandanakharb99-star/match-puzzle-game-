<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🍬 SWEET MATCH 3 🍬 | One Match = One Point</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a1225 0%, #0a0612 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 12px 14px 20px 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 620px;
            margin: auto;
        }

        .game-panel {
            background: #fff8ec;
            border-radius: 42px;
            padding: 14px 14px 18px 14px;
            box-shadow: inset 0 0 0 2px #ffefcf, 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            background: #fffaec;
            width: 100%;
            height: auto;
            touch-action: manipulation;
        }

        /* Stats Bar - Flex wrap for mobile */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 8px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card {
            background: #4d2e5b;
            padding: 5px 16px;
            border-radius: 60px;
            box-shadow: inset 0 1px 2px rgba(255, 255, 200, 0.2), 0 4px 0 #2d1d38;
            color: #ffefc0;
            font-weight: bold;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex: 1;
            min-width: 85px;
            justify-content: center;
        }

        .card-label {
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #FFE0A3, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .turns-card {
            background: #2a1e36;
        }

        .combo-meter {
            background: #2e2538;
            border-radius: 60px;
            padding: 5px 14px;
            display: flex;
            align-items: baseline;
            gap: 6px;
            box-shadow: inset 0 1px 4px #5f4a6e, 0 4px 0 #1f1528;
            flex: 1;
            min-width: 85px;
            justify-content: center;
        }

        .reset-btn, .next-btn {
            background: #f0bc6e;
            border: none;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 40px;
            color: #3a2347;
            cursor: pointer;
            font-family: inherit;
            transition: 0.06s linear;
            box-shadow: 0 4px 0 #aa6f3c;
            touch-action: manipulation;
            min-width: 70px;
        }

        .reset-btn:active, .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #aa6f3c;
        }

        .progress-area {
            background: #f3e1be;
            border-radius: 50px;
            padding: 8px 14px;
            font-weight: bold;
            text-align: center;
            font-size: 0.8rem;
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .level-goal {
            background: #5c3d6e;
            padding: 5px 12px;
            border-radius: 40px;
            color: #ffdd99;
            font-weight: bold;
            flex: 2;
            text-align: center;
            font-size: 0.75rem;
        }

        @media (max-width: 550px) {
            .game-container {
                padding: 8px 10px 16px 10px;
            }
            .card {
                padding: 4px 10px;
                min-width: 70px;
            }
            .card-value {
                font-size: 1.1rem;
            }
            .card-label {
                font-size: 0.6rem;
            }
            .combo-meter {
                padding: 4px 10px;
                min-width: 70px;
            }
            .reset-btn, .next-btn {
                padding: 5px 10px;
                font-size: 0.75rem;
                min-width: 60px;
            }
            .level-goal {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
        }

        @media (max-width: 450px) {
            .stats-bar {
                gap: 6px;
            }
            .card-value {
                font-size: 0.95rem;
            }
        }

        .turns-warning {
            animation: pulseWarning 0.5s ease;
        }

        @keyframes pulseWarning {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); text-shadow: 0 0 4px red; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="game-panel">
            <div class="stats-bar">
                <div class="card">
                    <span class="card-label">🔥 LVL</span>
                    <span class="card-value" id="levelDisplay">1</span>
                </div>
                <div class="card turns-card">
                    <span class="card-label">🔄 TURNS</span>
                    <span class="card-value" id="turnsDisplay">20</span>
                </div>
                <div class="card">
                    <span class="card-label">🍬 SCORE</span>
                    <span class="card-value" id="scoreDisplay">0</span>
                </div>
                <div class="combo-meter">
                    <span class="card-label">⚡ CHAIN</span>
                    <span class="card-value" id="comboDisplay">0</span>
                </div>
                <button class="reset-btn" id="resetGameBtn">🌀</button>
            </div>
            <canvas id="gameCanvas" width="540" height="540"></canvas>
            <div class="progress-area">
                <span>🎯 NEED: <span id="targetScoreSpan">15</span> matches</span>
                <div class="level-goal" id="levelMessage">
                    1 match = 1 point
                </div>
                <button class="next-btn" id="nextLevelBtn">⭐ NEXT</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // Audio for feedback (works on mobile after first touch)
        let audioCtx = null;
        function initAudio() {
            if(audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) { console.log("Web Audio not supported"); }
        }
        function playSound(freq = 440, duration = 0.18, volume = 0.1) {
            if(!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.start();
                osc.stop(now + duration);
            } catch(e) {}
        }

        // ---------- GAME CONFIG ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let ROWS = 8, COLS = 8;
        let TILE_SIZE = canvas.width / COLS;
        const CANDY_TYPES = 6;
        const POINTS_PER_MATCH = 1;   // each match = exactly 1 point
        
        let grid = [];
        let score = 0;
        let currentCombo = 0;
        let selectedTile = null;
        let processingMove = false;
        let currentLevel = 1;
        let levelTarget = 15;
        let turnsLeft = 20;
        let levelCompleted = false;
        let particles = [];
        
        // DOM elements
        const scoreSpan = document.getElementById('scoreDisplay');
        const comboSpan = document.getElementById('comboDisplay');
        const levelSpan = document.getElementById('levelDisplay');
        const targetSpan = document.getElementById('targetScoreSpan');
        const levelMsgSpan = document.getElementById('levelMessage');
        const turnsDisplaySpan = document.getElementById('turnsDisplay');
        const resetBtn = document.getElementById('resetGameBtn');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        
        // ----- Difficulty scaling -----
        function getLevelTarget(level) {
            let base = 15 + (level-1) * 3;
            if(level > 30) base = 90 + (level-30) * 2;
            if(level > 60) base = 140 + (level-60) * 1;
            return Math.min(base, 250);
        }
        
        function getTurnsForLevel(level) {
            let turns = 22 - Math.floor((level-1) / 3);
            if(level > 25) turns = 14 - Math.floor((level-25) / 5);
            if(level > 50) turns = 9 - Math.floor((level-50) / 8);
            return Math.max(5, Math.min(22, turns));
        }
        
        function updateTurnsDisplay() {
            turnsDisplaySpan.innerText = turnsLeft;
            if(turnsLeft <= 2 && turnsLeft > 0 && !levelCompleted) {
                turnsDisplaySpan.style.color = "#ff8888";
                turnsDisplaySpan.style.animation = "pulseWarning 0.5s";
                setTimeout(() => { turnsDisplaySpan.style.animation = ""; }, 500);
            } else {
                turnsDisplaySpan.style.color = "";
            }
        }
        
        // ----- Board Helpers -----
        function randomCandy() {
            return Math.floor(Math.random() * CANDY_TYPES) + 1;
        }
        
        function generateNoMatchBoard() {
            let newGrid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            for(let r = 0; r < ROWS; r++) {
                for(let c = 0; c < COLS; c++) {
                    let candidates = [1,2,3,4,5,6];
                    for(let i = candidates.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                    }
                    let placed = false;
                    for(let candy of candidates) {
                        if(c >= 2 && newGrid[r][c-1] === candy && newGrid[r][c-2] === candy) continue;
                        if(r >= 2 && newGrid[r-1][c] === candy && newGrid[r-2][c] === candy) continue;
                        newGrid[r][c] = candy;
                        placed = true;
                        break;
                    }
                    if(!placed) newGrid[r][c] = (r % CANDY_TYPES) + 1;
                }
            }
            return newGrid;
        }
        
        // Match detection (returns Set of positions "r,c")
        function getAllMatches(board) {
            let matchesSet = new Set();
            for(let r = 0; r < ROWS; r++) {
                let run = 1;
                for(let c = 1; c <= COLS; c++) {
                    if(c < COLS && board[r][c] !== 0 && board[r][c] === board[r][c-1] && board[r][c] <= CANDY_TYPES) {
                        run++;
                    } else {
                        if(run >= 3) {
                            for(let i = c - run; i < c; i++) matchesSet.add(`${r},${i}`);
                        }
                        run = 1;
                    }
                }
            }
            for(let c = 0; c < COLS; c++) {
                let run = 1;
                for(let r = 1; r <= ROWS; r++) {
                    if(r < ROWS && board[r][c] !== 0 && board[r][c] === board[r-1][c] && board[r][c] <= CANDY_TYPES) {
                        run++;
                    } else {
                        if(run >= 3) {
                            for(let i = r - run; i < r; i++) matchesSet.add(`${i},${c}`);
                        }
                        run = 1;
                    }
                }
            }
            return matchesSet;
        }
        
        // Prism creation for 4+ matches (special power-up)
        function processSpecialPrism(board, matchPositionsSet) {
            let prismPositions = [];
            for(let r = 0; r < ROWS; r++) {
                let run = 1;
                for(let c = 1; c <= COLS; c++) {
                    if(c < COLS && board[r][c] !== 0 && board[r][c] === board[r][c-1] && board[r][c] !== 7 && board[r][c] <= CANDY_TYPES) {
                        run++;
                    } else {
                        if(run >= 4) {
                            let start = c - run, end = c - 1;
                            let midCol = Math.floor((start + end) / 2);
                            prismPositions.push({row: r, col: midCol});
                        }
                        run = 1;
                    }
                }
            }
            for(let c = 0; c < COLS; c++) {
                let run = 1;
                for(let r = 1; r <= ROWS; r++) {
                    if(r < ROWS && board[r][c] !== 0 && board[r][c] === board[r-1][c] && board[r][c] !== 7 && board[r][c] <= CANDY_TYPES) {
                        run++;
                    } else {
                        if(run >= 4) {
                            let start = r - run, end = r - 1;
                            let midRow = Math.floor((start + end) / 2);
                            prismPositions.push({row: midRow, col: c});
                        }
                        run = 1;
                    }
                }
            }
            for(let pos of prismPositions) {
                let key = `${pos.row},${pos.col}`;
                if(matchPositionsSet.has(key)) board[pos.row][pos.col] = 7;
            }
        }
        
        function applyGravityAndRefill(board) {
            for(let c = 0; c < COLS; c++) {
                let colVals = [];
                for(let r = ROWS-1; r >= 0; r--) {
                    if(board[r][c] !== 0 && board[r][c] !== 7) colVals.push(board[r][c]);
                    else if(board[r][c] === 7) colVals.push(7);
                }
                while(colVals.length < ROWS) colVals.push(randomCandy());
                colVals.reverse();
                for(let r = 0; r < ROWS; r++) board[r][c] = colVals[r];
            }
        }
        
        function addParticleEffect(x, y, count=5) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x + (Math.random()-0.5)*TILE_SIZE,
                    y: y + (Math.random()-0.5)*TILE_SIZE,
                    vx: (Math.random()-0.5)*2.8,
                    vy: (Math.random()-0.5)*2.5 - 1.2,
                    life: 0.65,
                    size: 3 + Math.random()*5,
                    color: `hsl(${Math.random()*60 + 30}, 85%, 65%)`
                });
            }
        }
        
        // Resolve matches + cascade, each distinct match group = 1 point
        async function resolveMatchesAndCascade(startCombo) {
            let totalMatches = 0;
            let chain = startCombo;
            let maxLoop = 20;
            
            while(maxLoop-- > 0) {
                let matchSet = getAllMatches(grid);
                if(matchSet.size === 0) break;
                
                processSpecialPrism(grid, matchSet);
                let finalMatch = getAllMatches(grid);
                if(finalMatch.size === 0) finalMatch = matchSet;
                
                if(finalMatch.size > 0) {
                    // Group positions into contiguous match groups (each group = 3+ adjacent tiles)
                    let visited = new Set();
                    let groups = [];
                    for(let pos of finalMatch) {
                        if(visited.has(pos)) continue;
                        let [r,c] = pos.split(',').map(Number);
                        let group = new Set();
                        let queue = [[r,c]];
                        visited.add(pos);
                        group.add(pos);
                        while(queue.length) {
                            let [cr, cc] = queue.shift();
                            [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc]) => {
                                let nr = cr+dr, nc = cc+dc;
                                let key = `${nr},${nc}`;
                                if(finalMatch.has(key) && !visited.has(key)) {
                                    visited.add(key);
                                    group.add(key);
                                    queue.push([nr,nc]);
                                }
                            });
                        }
                        if(group.size >= 3) groups.push(group);
                    }
                    
                    let pointsGained = groups.length;  // each match group = 1 point
                    if(pointsGained > 0) {
                        totalMatches += pointsGained;
                        score += pointsGained;
                        chain++;
                        currentCombo = chain;
                        updateUI();
                        playSound(440 + pointsGained * 18, 0.2, 0.1);
                        // particles
                        for(let grp of groups) {
                            let center = {x:0, y:0, count:0};
                            for(let pos of grp) {
                                let [pr, pc] = pos.split(',').map(Number);
                                center.x += pc * TILE_SIZE + TILE_SIZE/2;
                                center.y += pr * TILE_SIZE + TILE_SIZE/2;
                                center.count++;
                            }
                            if(center.count) {
                                addParticleEffect(center.x/center.count, center.y/center.count, 6);
                            }
                        }
                        // clear matched tiles
                        for(let pos of finalMatch) {
                            let [r,c] = pos.split(',').map(Number);
                            grid[r][c] = 0;
                        }
                        applyGravityAndRefill(grid);
                        drawBoard();
                        await delay(70);
                    } else break;
                } else break;
            }
            if(totalMatches === 0) {
                currentCombo = 0;
                updateUI();
            }
            return totalMatches;
        }
        
        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
        
        // ----- SWAP (consumes turn) -----
        async function trySwap(r1,c1, r2,c2) {
            if(processingMove) return false;
            if(levelCompleted) {
                levelMsgSpan.innerText = "🎉 Complete! Press NEXT ➡️";
                return false;
            }
            if(turnsLeft <= 0) {
                levelMsgSpan.innerText = "❌ No turns! Restart game.";
                playSound(220,0.3,0.12);
                return false;
            }
            
            // Swap test
            let temp = grid[r1][c1];
            grid[r1][c1] = grid[r2][c2];
            grid[r2][c2] = temp;
            let matches = getAllMatches(grid);
            if(matches.size === 0) {
                // revert - no turn consumed
                temp = grid[r1][c1];
                grid[r1][c1] = grid[r2][c2];
                grid[r2][c2] = temp;
                playSound(300,0.18,0.08);
                levelMsgSpan.innerText = "❌ No match! Try again";
                setTimeout(() => updateUI(), 700);
                return false;
            }
            
            // Valid move: consume turn
            turnsLeft--;
            updateTurnsDisplay();
            playSound(523,0.12,0.1);
            processingMove = true;
            drawBoard();
            await delay(70);
            
            let matchesMade = await resolveMatchesAndCascade(currentCombo);
            processingMove = false;
            drawBoard();
            updateUI();
            
            if(matchesMade > 0) {
                levelMsgSpan.innerText = `✓ MATCH! +${matchesMade} pt${matchesMade>1?'s':''} (${turnsLeft} turns left)`;
                setTimeout(() => updateUI(), 1000);
            }
            if(turnsLeft === 0 && !levelCompleted && score < levelTarget) {
                levelMsgSpan.innerText = "💀 OUT OF TURNS! Press RESTART 💀";
                levelMsgSpan.style.background = "#d9534f";
            }
            return true;
        }
        
        // ----- PRISM BLAST (free, doesn't consume turn)-----
        async function activatePrism(row, col) {
            if(processingMove || grid[row][col] !== 7) return false;
            if(levelCompleted) return false;
            processingMove = true;
            playSound(880,0.2,0.18);
            levelMsgSpan.innerText = "✨ PRISM BLAST! Row+Col cleared ✨";
            for(let c=0; c<COLS; c++) {
                if(grid[row][c] !== 0) addParticleEffect(c*TILE_SIZE+TILE_SIZE/2, row*TILE_SIZE+TILE_SIZE/2, 3);
                grid[row][c] = 0;
            }
            for(let r=0; r<ROWS; r++) {
                if(grid[r][col] !== 0 && r !== row) addParticleEffect(col*TILE_SIZE+TILE_SIZE/2, r*TILE_SIZE+TILE_SIZE/2, 3);
                grid[r][col] = 0;
            }
            drawBoard();
            await delay(160);
            applyGravityAndRefill(grid);
            drawBoard();
            await delay(90);
            await resolveMatchesAndCascade(currentCombo);
            processingMove = false;
            drawBoard();
            updateUI();
            return true;
        }
        
        // ----- UI update & level target -----
        function updateUI() {
            scoreSpan.innerText = Math.floor(score);
            comboSpan.innerText = currentCombo;
            levelSpan.innerText = currentLevel;
            targetSpan.innerText = levelTarget;
            updateTurnsDisplay();
            
            if(score >= levelTarget && !levelCompleted) {
                levelCompleted = true;
                levelMsgSpan.innerText = "🎉 LEVEL COMPLETE! Press NEXT 🎉";
                levelMsgSpan.style.background = "#f7b05e";
                levelMsgSpan.style.color = "#2d1d38";
                playSound(659,0.25,0.16);
                playSound(880,0.25,0.16);
            } else if(score < levelTarget && !levelCompleted) {
                if(turnsLeft > 0) {
                    levelMsgSpan.innerText = `🔒 NEED ${levelTarget - Math.floor(score)} matches | ${turnsLeft} turns left 🔒`;
                } else {
                    levelMsgSpan.innerText = `💀 OUT OF TURNS! ${score}/${levelTarget} matches 💀`;
                }
                levelMsgSpan.style.background = "#5c3d6e";
                levelMsgSpan.style.color = "#ffdd99";
            }
        }
        
        function advanceToNextLevel() {
            if(processingMove) {
                levelMsgSpan.innerText = "Wait... board busy";
                return;
            }
            if(score >= levelTarget) {
                currentLevel++;
                levelTarget = getLevelTarget(currentLevel);
                turnsLeft = getTurnsForLevel(currentLevel);
                grid = generateNoMatchBoard();
                selectedTile = null;
                currentCombo = 0;
                levelCompleted = false;
                drawBoard();
                updateUI();
                playSound(523,0.2,0.13);
                playSound(659,0.2,0.13);
                levelMsgSpan.innerText = `⭐ LEVEL ${currentLevel}! Need ${levelTarget} matches, ${turnsLeft} turns ⭐`;
                setTimeout(() => updateUI(), 1500);
            } else {
                levelMsgSpan.innerText = `❌ Need ${levelTarget - Math.floor(score)} more matches!`;
                playSound(300,0.2,0.1);
                setTimeout(() => updateUI(), 1200);
            }
        }
        
        function resetGame() {
            if(processingMove) return;
            currentLevel = 1;
            score = 0;
            currentCombo = 0;
            levelTarget = getLevelTarget(1);
            turnsLeft = getTurnsForLevel(1);
            levelCompleted = false;
            selectedTile = null;
            grid = generateNoMatchBoard();
            updateUI();
            drawBoard();
            levelMsgSpan.innerText = "🌀 RESTART! Each match = 1 point 🌀";
            playSound(400,0.2,0.1);
            setTimeout(() => updateUI(), 1300);
        }
        
        // -------------- DRAWING (optimized for mobile) --------------
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    let x = c * TILE_SIZE;
                    let y = r * TILE_SIZE;
                    ctx.fillStyle = "#fff2df";
                    ctx.beginPath();
                    ctx.roundRect(x+2, y+2, TILE_SIZE-4, TILE_SIZE-4, 10);
                    ctx.fill();
                    ctx.fillStyle = "#ffe1b3";
                    ctx.beginPath();
                    ctx.roundRect(x, y, TILE_SIZE-2, TILE_SIZE-2, 12);
                    ctx.fill();
                    
                    let type = grid[r][c];
                    let icon = "🍬";
                    if(type === 1) icon = "🍎";
                    else if(type === 2) icon = "🍊";
                    else if(type === 3) icon = "🍋";
                    else if(type === 4) icon = "🍇";
                    else if(type === 5) icon = "🍒";
                    else if(type === 6) icon = "🍬";
                    else if(type === 7) icon = "✨";
                    
                    ctx.font = `${Math.floor(TILE_SIZE * 0.55)}px "Segoe UI Emoji", "Apple Color Emoji"`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    
                    if(type === 7) {
                        ctx.fillStyle = "#FFD966";
                        ctx.fillText("🌟", x + TILE_SIZE/2, y + TILE_SIZE/2);
                        ctx.fillStyle = "#f0b27a";
                        ctx.fillText(icon, x + TILE_SIZE/2 - 2, y + TILE_SIZE/2 - 2);
                    } else {
                        ctx.fillStyle = "#2d1f35";
                        ctx.fillText(icon, x + TILE_SIZE/2, y + TILE_SIZE/2);
                    }
                    
                    if(selectedTile && selectedTile.row === r && selectedTile.col === c) {
                        ctx.beginPath();
                        ctx.rect(x+3, y+3, TILE_SIZE-8, TILE_SIZE-8);
                        ctx.strokeStyle = "#ffb347";
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                }
            }
            // particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.size *= 0.98;
                if(p.life <= 0 || p.y > canvas.height+40) particles.splice(i,1);
            }
        }
        
        function animate() {
            drawBoard();
            requestAnimationFrame(animate);
        }
        
        // ----- Touch / Click handling (mobile friendly) -----
        function handleCanvasClick(e) {
            if(processingMove) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if(e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            if(canvasX < 0 || canvasY < 0) return;
            let col = Math.floor(canvasX / TILE_SIZE);
            let row = Math.floor(canvasY / TILE_SIZE);
            if(row >= ROWS || col >= COLS) return;
            
            if(grid[row][col] === 7) {
                activatePrism(row, col);
                return;
            }
            
            if(selectedTile === null) {
                selectedTile = { row, col };
                drawBoard();
            } else {
                let r1 = selectedTile.row, c1 = selectedTile.col;
                let r2 = row, c2 = col;
                if(Math.abs(r1-r2) + Math.abs(c1-c2) === 1) {
                    trySwap(r1,c1, r2,c2).then(() => {
                        selectedTile = null;
                        drawBoard();
                    });
                } else {
                    selectedTile = { row, col };
                    drawBoard();
                }
            }
        }
        
        // roundRect helper
        if(!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
                if(w<2*r) r=w/2;
                if(h<2*r) r=h/2;
                this.moveTo(x+r,y);
                this.lineTo(x+w-r,y);
                this.quadraticCurveTo(x+w,y,x+w,y+r);
                this.lineTo(x+w,y+h-r);
                this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
                this.lineTo(x+r,y+h);
                this.quadraticCurveTo(x,y+h,x,y+h-r);
                this.lineTo(x,y+r);
                this.quadraticCurveTo(x,y,x+r,y);
                return this;
            };
        }
        
        // resize handler to keep canvas crisp
        function handleResize() {
            // canvas size fixed 540px logical, fine for mobile
            TILE_SIZE = canvas.width / COLS;
            drawBoard();
        }
        
        // initialization
        function init() {
            initAudio();
            canvas.addEventListener('click', handleCanvasClick);
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleCanvasClick(e);
            });
            resetBtn.addEventListener('click', resetGame);
            nextLevelBtn.addEventListener('click', advanceToNextLevel);
            window.addEventListener('resize', handleResize);
            grid = generateNoMatchBoard();
            levelTarget = getLevelTarget(1);
            turnsLeft = getTurnsForLevel(1);
            updateUI();
            drawBoard();
            animate();
            // enable audio after first user tap
            document.body.addEventListener('touchstart', function resumeAudio() {
                if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });
        }
        
        init();
    })();
</script>
</body>
